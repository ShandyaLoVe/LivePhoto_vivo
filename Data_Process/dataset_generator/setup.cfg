# Installable package metadata, dependencies, and console commands.

[metadata]
name = livephoto-dataset-generator
version = 0.1.0
description = Generate aligned GT, reference, and low-quality clips from videos.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.23.0,<3.0
    opencv-python-headless>=4.8.0,<5.0
    PyYAML>=6.0,<7.0

[options.packages.find]
include =
    dataset*

[options.entry_points]
console_scripts =
    livephoto-generate = dataset.cli:generate_main
    livephoto-regenerate-lq = dataset.cli:regenerate_main
    livephoto-validate = dataset.cli:validate_main
