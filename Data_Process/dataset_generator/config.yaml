# Default configuration for general video dataset generation.

# Paths are resolved from the working directory where the command is run.
input_dir: ./videos
output_dir: ./dataset_output

seed: 42
num_workers: 8
overwrite: false
ffmpeg_bin: ffmpeg
ffprobe_bin: ffprobe

video:
  extensions: [mp4, mov, mkv, avi, webm, m4v, mpeg, mpg, ts, yuv]
  # true: inspect every regular file with ffprobe; suffixes are never trusted.
  scan_all_files: true
  exclude_dir_names: []
  # Keep already completed clips if corruption appears later in a video.
  allow_partial_decode: true

  # A raw .yuv file has no header. Set global defaults here, add a per-file
  # override below, or create <video>.yuv.json beside each file.
  raw_yuv:
    enabled: true
    width: null
    height: null
    pix_fmt: yuv420p
    fps: 30.0
    rotation: 0
    use_sidecar: true
    sidecar_suffix: .json
    files: {}
    # Per-file example (path is relative to input_dir):
    # files:
    #   camera_a/clip001.yuv:
    #     width: 1920
    #     height: 1080
    #     pix_fmt: yuv420p10le
    #     fps: 30

clip:
  num_frames: 7
  frame_interval: 1
  clip_stride: 7
  drop_last: true
  # To sample by real duration, set all three fields below. Example:
  # 45 frames at 15 FPS = one 3-second clip.
  sampling_fps: null
  clip_duration_seconds: null
  clip_stride_seconds: null

image:
  width: 512
  height: 512
  # Optional aliases: gt_width / gt_height. crop_size (int or [H, W])
  # overrides width/height as the final output size.
  gt_width: null
  gt_height: null
  # Set true to keep each source video's native dimensions for GT/REF.
  preserve_source_resolution: false
  # Leave null to make LQ match GT, or set a distinct training resolution.
  lq_width: null
  lq_height: null
  lq_interpolation: area
  crop_size: null
  keep_aspect_ratio: true
  random_crop: true
  center_crop: false
  interpolation: lanczos

reference:
  # center | first | last | random | sharpest
  strategy: center

degradation:
  # frame_independent | clip_consistent
  mode: clip_consistent
  temporal_variation: 0.03

  blur:
    enabled: true
    sigma: [0.2, 3.0]

  motion_blur:
    enabled: false
    kernel_size: [3, 15]
    angle: [-180.0, 180.0]

  downsample:
    enabled: true
    scale: [1.0, 4.0]
    down_interpolation: area
    up_interpolation: cubic

  gaussian_noise:
    enabled: true
    sigma: [0.0, 20.0]

  poisson_noise:
    enabled: false
    peak: [30.0, 60.0]

  # Optional clip-consistent phone color rendering. RGB biases are in 8-bit
  # code values; gain/bias, luma contrast/offset and chroma are recorded in meta.
  device_style:
    enabled: false
    profile: random
    profiles: {}

  color_distortion:
    enabled: false
    saturation: [0.85, 1.15]
    hue_shift: [-5.0, 5.0]

  brightness_contrast:
    enabled: false
    brightness: [-10.0, 10.0]
    contrast: [0.9, 1.1]

  gamma:
    enabled: false
    gamma: [0.85, 1.2]

  # amount > 1 can create oversharpening.
  sharpen:
    enabled: false
    amount: [0.0, 1.5]
    radius: [0.5, 1.5]

  jpeg:
    enabled: true
    quality: [30, 95]

  # Real clip-level encode/decode. This is intentionally clip-level in both modes.
  video_compression:
    enabled: false
    codec: libx264
    crf: [18, 38]
    preset: medium
    keyint: 12

split:
  train: 0.8
  val: 0.1
  test: 0.1
